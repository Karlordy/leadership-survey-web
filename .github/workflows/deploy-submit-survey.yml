name: Deploy submit-survey

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/submit-survey/**"
      - ".github/workflows/deploy-submit-survey.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy submit-survey Edge Function
        run: supabase functions deploy submit-survey --project-ref "$SUPABASE_PROJECT_ID"
